# Supabase local development configuration.
project_id = "cedula-py"

[api]
enabled = true
port = 54321
# Only `app` is exposed as a Data API surface. `core` is served through the
# application's own read paths; research, audit and security are never exposed.
schemas = ["app"]
extra_search_path = ["public"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
# Transaction pooling: server-side prepared statements must be disabled in the
# client (postgres.js `prepare: false`), and no session affinity may be assumed.
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Exact, trusted redirect targets only. No wildcards in any deployed project.
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true

[auth.mfa]
# Privileged administrative actions require AAL2.
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
