name: Deploy RutaFútbol PY to GitHub Pages

# GitHub Pages ist für dieses Repository im Branch-Modus aktiviert und
# veröffentlicht den Branch `gh-pages`. Dieser Workflow spiegelt deshalb
# jeden Stand von `main` nach `gh-pages`; GitHub baut die Seite danach
# automatisch ("pages build and deployment").
#
# Der frühere Weg über actions/configure-pages + deploy-pages funktioniert
# hier nicht: Er setzt voraus, dass unter Settings → Pages als Quelle
# "GitHub Actions" eingestellt ist. Ohne diese Einstellung bricht er mit
# "Get Pages site failed" bzw. "Create Pages site failed: Resource not
# accessible by integration" ab – ein Workflow-Token darf eine Pages-Site
# nicht selbst anlegen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish current main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:refs/heads/gh-pages
